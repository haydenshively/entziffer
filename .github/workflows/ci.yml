name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r build
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: extension e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @entziffer/extension exec playwright install --with-deps chromium
      - run: pnpm --filter @entziffer/extension test:e2e
      - run: pnpm --filter @entziffer/extension zip
      - uses: actions/upload-artifact@v4
        with:
          name: entziffer-extension
          path: packages/extension/entziffer-extension-*.zip
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/extension/playwright-report
          if-no-files-found: ignore
