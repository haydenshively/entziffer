name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - uses: actions/download-artifact@v8
        with:
          name: entziffer-extension
          path: dist-release
      - id: zip
        run: |
          path="$(ls dist-release/entziffer-extension-*.zip | head -n1)"
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ steps.zip.outputs.path }}
          generate_release_notes: true

      # `pnpm publish -r` rewrites the `workspace:` protocol in dependencies to real
      # version ranges; `npm publish` would ship an uninstallable package.
      - run: pnpm publish -r --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
