name: Release

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Read local version
        id: local
        run: |
          cli="$(jq -r .version packages/cli/package.json)"
          core="$(jq -r .version packages/core/package.json)"
          if [ "$cli" != "$core" ]; then
            echo "::error::packages/cli is $cli but packages/core is $core; bump them together"
            exit 1
          fi
          echo "version=$cli" >> "$GITHUB_OUTPUT"

      - name: Read npm version
        id: npm
        run: |
          version="$(pnpm view entziffer version --registry https://registry.npmjs.org 2>/dev/null || echo "")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag exists
        id: tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.local.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # `pnpm publish -r` rewrites the `workspace:` protocol in dependencies to real
      # version ranges; `npm publish` would ship an uninstallable package. Auth is npm
      # trusted publishing over the job's OIDC token, so no NODE_AUTH_TOKEN is set.
      - name: Publish to npm
        if: steps.local.outputs.version != steps.npm.outputs.version
        run: pnpm publish -r --access public --provenance --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.exists == 'false'
        with:
          name: entziffer-extension
          path: dist-release
      - id: zip
        if: steps.tag.outputs.exists == 'false'
        run: |
          path="$(ls dist-release/entziffer-extension-*.zip | head -n1)"
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.local.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: ${{ steps.zip.outputs.path }}
          fail_on_unmatched_files: true
