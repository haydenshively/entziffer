<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unlock entziffer</title>
    <link rel="stylesheet" href="./unlock.css" />
  </head>
  <body>
    <main class="card glass">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
          <path d="M9.6 19.5V11.5a2.4 2.8 0 0 1 4.8 0V18" />
          <path d="M7.1 21V11.5a4.9 5.6 0 0 1 9.8 0V19" />
          <path d="M4.6 19.5V11.5a7.4 8.2 0 0 1 14.8 0V16.5" />
          <path d="M2.4 15V11.5a9.6 10.2 0 0 1 19.2 0V13" />
        </svg>
      </span>
      <h1>Unlock entziffer</h1>
      <p id="state" class="muted">Waiting for your passkey…</p>
      <button id="retry" class="glass-button primary" type="button" hidden>Use passkey</button>
      <p class="footnote muted">
        entziffer stores no private key. Touch ID re-derives it for this browser session only.
      </p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
