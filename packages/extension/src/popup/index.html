<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>entziffer</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <h1>entziffer</h1>
    <p id="state" class="muted">Loading…</p>
    <dl id="identity" hidden>
      <dt>Fingerprint</dt>
      <dd><code id="fingerprint"></code></dd>
    </dl>
    <div class="row">
      <button id="unlock" type="button" hidden>Unlock</button>
      <button id="lock" type="button" hidden>Lock now</button>
    </div>
    <div class="row">
      <button id="copy-public" type="button" hidden>Copy public key</button>
      <button id="options" type="button">Open settings</button>
    </div>
    <div id="site-row" hidden>
      <p id="site-state" class="muted"></p>
      <button id="enable-site" type="button" hidden>Enable on this site</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
