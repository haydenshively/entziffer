<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>entziffer</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="panel glass">
      <header class="head">
        <span class="mark" aria-hidden="true">
          <svg viewBox="210 312 600 400" fill="currentColor" aria-hidden="true">
            <rect x="494" y="348" width="36" height="328" rx="18" />
            <path d="M327.4 407.0H376.3L371.1 512.0H332.6ZM327.4 617.0 332.6 512.0H371.1L376.3 617.0ZM249.8 478.3 274.8 440.0 361.6 496.6 342.3 527.3ZM454.2 478.3 361.7 527.3 342.4 496.6 429.2 440.0ZM454.1 545.6 429.1 583.9 342.3 527.3 361.6 496.6ZM249.8 546.0 342.3 497.0 361.6 527.6 274.8 584.3Z" />
            <path d="M649.6 630.0Q626.9 630.0 609.8 621.3Q592.6 612.6 583.0 597.1Q573.4 581.6 573.4 561.3V560.9Q573.4 540.7 583.5 526.2Q593.6 511.7 612.8 503.3Q632.0 494.8 659.2 493.1L745.9 488.0V522.3L666.3 527.4Q646.1 528.5 635.3 536.9Q624.5 545.3 624.5 559.2V559.6Q624.5 573.9 635.4 582.1Q646.2 590.4 664.3 590.4Q680.1 590.4 692.5 584.0Q705.0 577.6 712.3 566.5Q719.6 555.3 719.6 541.4V473.3Q719.6 455.5 708.4 445.3Q697.2 435.1 676.4 435.1Q657.0 435.1 645.3 443.4Q633.6 451.6 630.8 464.6L630.4 466.6H582.9L583.1 464.1Q584.9 444.1 596.5 428.2Q608.2 412.4 628.9 403.2Q649.6 394.0 678.0 394.0Q706.3 394.0 727.0 403.4Q747.8 412.7 759.2 429.7Q770.6 446.6 770.6 469.5V626.0H719.6V590.8H718.5Q712.0 602.7 701.5 611.6Q691.1 620.4 677.9 625.2Q664.7 630.0 649.6 630.0Z" />
          </svg>
        </span>
        <div class="titles">
          <h1>entziffer</h1>
          <dl id="identity" hidden>
            <dt>Fingerprint</dt>
            <dd><code id="fingerprint" class="pill mono"></code></dd>
          </dl>
        </div>
        <span class="state-pill pill" aria-hidden="true"></span>
      </header>

      <p id="state" class="muted">Loading…</p>

      <div class="row">
        <button id="unlock" class="glass-button primary" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9.6 19.4V11.5a2.4 2.8 0 0 1 4.8 0V18" /><path d="M6.9 21V11.5a5.1 5.8 0 0 1 10.2 0V18.6" /><path d="M3.6 16.5V11.5a8.4 9 0 0 1 16.8 0V14.5" /></svg>
          Unlock
        </button>
        <button id="lock" class="glass-button" type="button" hidden>Lock now</button>
      </div>

      <div class="row">
        <button id="copy-public" class="glass-button" type="button" hidden>Copy public key</button>
        <button id="options" class="glass-button" type="button">Settings</button>
      </div>

      <div class="row">
        <button id="people" class="glass-button" type="button">People · 0</button>
      </div>

      <div id="site-row" hidden>
        <p id="site-state" class="muted"></p>
        <button id="enable-site" class="glass-button" type="button" hidden>Enable on this site</button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
